[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audience-genome-paper-submission"
version = "0.2.0"
description = "Sales Genome construction, induction, canonicalization and downstream experiments"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.22"]

[project.optional-dependencies]
extraction = ["trafilatura>=1.8"]
gnn = ["numpy>=1.26", "torch>=2.5", "torch-geometric>=2.6"]
embeddings = ["transformers>=4.51"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["paper_submission*", "lib*", "config*", "scripts*", "reference*", "experiments*"]
